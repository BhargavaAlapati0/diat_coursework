name: Build PDFs and Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - '**/*.xopp'
      - '.github/workflows/deploy-notes.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Xournal++
        run: |
          sudo apt-get update
          sudo apt-get install -y xournalpp

      - name: Compile .xopp Files to PDF
        run: |
          mkdir -p public
          
          # Export each .xopp file directly to the public directory
          find . -name "*.xopp" -not -path "./.git/*" | while IFS= read -r file; do
            filename=$(basename "$file" .xopp)
            echo "Converting $file -> public/$filename.pdf"
            xournalpp "$file" -p "public/$filename.pdf"
          done

      - name: Generate Index Webpage
        run: |
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Notes Library</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.5; color: #24292f; }
              h1 { border-bottom: 1px solid #d0d7de; padding-bottom: 8px; }
              ul { list-style-type: none; padding: 0; }
              li { margin: 12px 0; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
              a.view-btn { text-decoration: none; background: #0969da; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 14px; }
              a.view-btn:hover { background: #0854ad; }
              .title { font-weight: 600; }
            </style>
          </head>
          <body>
            <h1>Handwritten Notes</h1>
            <ul>
          EOF

          for pdf in public/*.pdf; do
            if [ -f "$pdf" ]; then
              base=$(basename "$pdf")
              name="${base%.pdf}"
              echo "    <li><span class=\"title\">$name</span><a class=\"view-btn\" href=\"$base\" target=\"_blank\">View PDF</a></li>" >> public/index.html
            fi
          done

          cat << 'EOF' >> public/index.html
            </ul>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
